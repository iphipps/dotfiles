# remap prefix to Control + a
set -g prefix C-a
# bind 'C-a C-a' to type 'C-a'
bind C-a send-prefix
unbind C-b

# Fix: don't hold Escape for 500ms waiting for an escape sequence.
# Critical for vi-mode in zsh/vim inside tmux.
set -sg escape-time 10

# True color + modern terminal features (needed for bat, delta, starship, nvim, etc.)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Bigger scrollback (default is 2000)
set -g history-limit 50000

# Auto-renumber windows when one closes (keeps indexing tidy)
set -g renumber-windows on

# Forward focus events so tools (nvim, etc.) can react to pane focus
set -g focus-events on

# Less aggressive status redraw — saves CPU
set -g status-interval 5

set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
set-option -s set-clipboard off

# Linux 
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -se c -i"
# Mac
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

bind-key -r -T prefix       M-Up              resize-pane -U 5
bind-key -r -T prefix       M-Down            resize-pane -D 5
bind-key -r -T prefix       M-Left            resize-pane -L 5
bind-key -r -T prefix       M-Right           resize-pane -R 5
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R


setw -g mode-keys vi

set -g default-shell /bin/zsh

set-option -g allow-rename off

# Start windows and panes index at 1.
set -g base-index 1
setw -g pane-base-index 1

# Split panes.
bind-key h split-window -v
bind-key v split-window -h

# Resize panes with Option + arrows (macOS)
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# Alternative if the above doesn't work
bind -n ‹ resize-pane -L 5
bind -n › resize-pane -R 5
bind -n ˆ resize-pane -U 5
bind -n ˇ resize-pane -D 5

# Reload tmux config with prefix + r
bind r source-file ~/.tmux.conf \;

# Per-session status bar color.
# Re-applied whenever the attached client switches sessions and when a new
# session is created. status-style is session-scoped, so each keeps its color.
set-hook -g client-session-changed 'run-shell -b "~/.tmux-session-color.sh"'
set-hook -g session-created        'run-shell -b "~/.tmux-session-color.sh"'

# Session picker (prefix + s) with a color swatch matching each session's
# status bar. Seed @session_color for every session first, then show the tree.
bind s run-shell "~/.tmux-session-color.sh --all" \; \
  choose-tree -Zs -F "#[bg=#{?@session_color,#{@session_color},colour8}]  #[default] #{session_name}#{?session_grouped, (group #{session_group}),} : #{session_windows}w#{?session_attached, (attached),}"


# List of plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'          # Keyboard yank to system clipboard
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto-save sessions (pairs with resurrect)
set -g @plugin 'wfxr/tmux-fzf-url'               # fzf URL picker (prefix + u)

# tmux-continuum: auto-save every 15 min, restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-thumbs removed: Santa is in Lockdown mode on this Mac and kills the
# locally-compiled Rust binary. tmux-fzf-url covers the URL-picking case.

run '~/.tmux/plugins/tpm/tpm'
